name: Build Executables

on:
  push:
    tags:
      - 'v*' # Runs when you push a tag like v1.0.1
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # This creates three separate virtual machines to build each OS
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pandas requests PyQt6

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconsole --onefile --add-data "src/wwmogi/resources;resources" --add-data "src/wwmogi/data_fetcher.py;." src/wwmogi/main_gui.py

      - name: Build with PyInstaller (Linux & macOS)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --noconsole --onefile --add-data "src/wwmogi/resources:resources" --add-data "src/wwmogi/data_fetcher.py:." src/wwmogi/main_gui.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.os }}
          path: dist/
